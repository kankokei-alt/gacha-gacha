<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff7eb0">
  <meta name="description" content="本物のガチャをがまんすると回せる、リアルご褒美が当たるおうちガチャ">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ガチャモン">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/gachamon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/gachamon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>ガチャモン</title>
</head>
<body>
  <header class="topbar">
    <button class="lv" id="lvBtn" aria-label="レベル">
      <span class="lv-row"><b id="lvNum">Lv.1</b><span class="lv-title" id="lvTitle"></span></span>
      <span class="xpbar"><i id="xpFill"></i></span>
    </button>
    <div class="wallet">
      <button class="pill ticket-pill" id="ticketPill" title="ガチャ券">
        <span class="tp-main">🎫 ガチャ券 <b id="tickets">0</b></span>
        <small class="tp-timer" id="timerNext"></small>
      </button>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="設定">⚙️</button>
  </header>

  <main>
    <section id="tab-gacha" class="tab active">
      <div id="installTip"></div>
      <div class="picker" id="machinePicker"></div>
      <div class="prize-strip" id="prizeStrip"></div>
      <div class="stage">
        <h2 class="machine-name" id="machineName"></h2>
        <div class="machine-wrap" id="machineWrap"></div>
        <p class="hint" id="turnHint"></p>
      </div>
      <button class="btn primary big wide pull-btn" id="btnPull"></button>
      <details class="lineup" id="lineup"></details>
    </section>

    <section id="tab-mini" class="tab"><div id="miniHub"></div><div id="miniArea"></div></section>
    <section id="tab-gaman" class="tab"></section>
    <section id="tab-prize" class="tab"></section>
    <section id="tab-zukan" class="tab"></section>
  </main>

  <nav class="tabbar">
    <button data-tab="gacha" class="active"><span>🎰</span>ガチャ</button>
    <button data-tab="mini"><span>🎮</span>あそぶ</button>
    <button data-tab="gaman"><span>💪</span>がまん<i class="dot hidden" id="gamanDot"></i></button>
    <button data-tab="prize"><span>🎁</span>ごほうび<i class="dot hidden" id="prizeDot"></i></button>
    <button data-tab="zukan"><span>📖</span>ずかん</button>
  </nav>

  <div id="toasts"></div>
  <div id="modal" class="overlay hidden"><div class="sheet" id="modalBody"></div></div>

  <div id="openOverlay" class="overlay dark hidden">
    <div class="open-stage" id="openStage">
      <div class="rays" id="rays"></div>
      <div class="big-cap" id="bigCap">
        <div class="cap-top"></div>
        <div class="cap-bottom"><span class="peek" id="peek"></span></div>
        <div class="cap-band"></div>
      </div>
      <p class="open-hint" id="openHint">タップしてあけよう！</p>
      <div class="result hidden" id="result"></div>
    </div>
  </div>
  <div id="confetti"></div>

  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/link.js"></script>
  <script src="js/phys.js"></script>
  <script src="js/gomoku.js"></script>
  <script src="js/mini.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
