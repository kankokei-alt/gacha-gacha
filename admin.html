<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3f7fd9">
  <meta name="robots" content="noindex">
  <link rel="icon" href="icons/gachamon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root { --pink: #3f7fd9; --pink-d: #2c64b3; --line: #d9e6f6; --bg: #f4f8fd; }
    body::before { background: radial-gradient(70% 45% at 0% 0%, #e3edff 0%, rgba(227, 237, 255, 0) 70%), radial-gradient(70% 45% at 100% 100%, #e8f6f2 0%, rgba(232, 246, 242, 0) 70%), linear-gradient(180deg, #f8fbff, #f4f8fd); }
    .topbar h1 { font-size: 1rem; margin: 0; flex: 1; }
    .btn.primary { background: linear-gradient(180deg, #6aa5ee, #3f7fd9); box-shadow: 0 4px 0 #2c64b3; }
    .btn.danger-fill { background: #fff; color: #e0405f; }
    main { padding-bottom: 40px; }
    .req-card { text-align: center; }
    .req-amt { font-size: 2.4rem; font-weight: 800; color: var(--pink-d); }
    .stepper { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 10px 0; }
    .stepper button { width: 44px; height: 44px; border-radius: 50%; font-size: 1.4rem; }
    .stepper b { font-size: 1.8rem; min-width: 70px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stats div { background: #f4f8fd; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; }
    .stats small { color: var(--muted); }
    .stats b { font-size: 1.2rem; }
    .log { list-style: none; padding: 0; margin: 0; font-size: .88rem; }
    .log li { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
    .warn { background: #fff8dc; border: 2px dashed #f5d36b; border-radius: 14px; padding: 10px 12px; font-size: .85rem; margin-bottom: 12px; }
  </style>
  <title>ガチャモン 管理</title>
</head>
<body>
  <header class="topbar">
    <h1>🔑 ガチャモン 管理ページ</h1>
  </header>
  <main id="main"></main>
  <div id="toasts"></div>
  <div id="modal" class="overlay hidden"><div class="sheet" id="modalBody"></div></div>
  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/link.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
